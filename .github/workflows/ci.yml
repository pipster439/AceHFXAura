name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and runtime tests
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify clean checkout
        shell: pwsh
        run: |
          if (Test-Path config.json) { throw 'Local config must not be tracked' }
          $generated = git ls-files 'plugins/src/effect_studio_*.cpp' 'plugins/src/effect_test_*.cpp' 'plugins/src/effect_adv_*.cpp'
          if ($generated) { throw 'Generated plugin sources must not be tracked' }
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target aura_daemon aura_web_ui test_gsi_rules --parallel 2
      - name: CTest
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Scratch tests
        run: python -B tests/test_scratch_blocks_and_library.py
      - name: Effects tests
        run: python -B tests/test_e2e_11_effects.py
      # Aura.exe embeds an ASUS driver not stored in Git. Its tests remain local.
      - name: WebUI and dry-run daemon entrypoints
        working-directory: tests
        env:
          AURA_BIN_DIR: ${{ github.workspace }}/build/Release
        run: python -B -m unittest -v test_runtime_entrypoints.TestWebUiEntrypoint test_runtime_entrypoints.TestDaemonEntrypoint

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
