name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows software CI
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      PYTHONUTF8: '1'
    steps:
      # Preserve existing major-version pinning; no product/toolchain upgrades.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('winui/**/*.csproj', 'src/**/*.csproj', 'tests/**/*.csproj', '**/NuGet.Config', '**/packages.lock.json', 'VERSION') }}
      - name: Run shared software CI
        shell: pwsh
        run: ./tools/ci/run-ci.ps1
      - name: Publish concise summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path artifacts/ci/step-summary.md) {
            Get-Content artifacts/ci/step-summary.md | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload software evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: software-ci-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            artifacts/ci/ci-summary.json
            artifacts/ci/step-summary.md
            artifacts/ci/*.log
            artifacts/ci/ctest-discovery.json
            artifacts/ci/ctest-results.xml
            artifacts/ci/aura-gate-a-tests.xml
            artifacts/ci/dotnet-test/**/*.trx
